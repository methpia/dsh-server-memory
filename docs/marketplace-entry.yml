# Marketplace entry for awesome-dsh-plugin
#
# The list is generated from data/plugins/, one YAML per plugin. Submit this as a
# pull request that RENAMES the existing entry file:
#   data/plugins/methpia__dsh-server-memory--plugins.yml
#   -> data/plugins/methpia__dsh-server-memory--dsh-server-memory.yml
# and updates its url/name as below. Do not edit either README in that
# repository — they are regenerated.
#
# Why the subdirectory URL: the DSH plugin lives in `dsh-server-memory/` of this
# repo (the memoryd server and the WorkBuddy adapter sit beside it). The
# directory leaf becomes the storefront name, so it must be the product name —
# that is exactly why it is not called `plugins/`.
url: https://github.com/methpia/dsh-server-memory/tree/main/dsh-server-memory
name: methpia/dsh-server-memory#dsh-server-memory
category: memory
description:
  en: 'Self-hosted project memory for DSH: a compact prompt index, search and save tools, and up to one consolidation per day written back to your own memoryd service, which runs on your laptop, a LAN box or a cloud server and never calls an LLM itself.'
  zh: '为 DSH 提供的自托管项目记忆：紧凑的提示索引、检索与写入工具，以及每天至多一次写回自有 memoryd 的聚合；这个服务可以跑在笔记本、局域网机器或云服务器上，且自身不调用 LLM。'
icon: https://raw.githubusercontent.com/methpia/dsh-server-memory/main/assets/icon-180.png
